name: web-next

on:
  pull_request:
    paths:
      - "client/web-next/**"
      - ".github/workflows/web-next.yml"

permissions:
  contents: read

jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/web-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/web-next/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
