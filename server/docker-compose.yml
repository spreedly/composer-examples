# Runs every language sidecar side by side on its own port.
# Each sidecar's DODGEBALL_API_URL and DODGEBALL_SECRET_KEY come from its .env file.
# Copy .env.example to .env in each folder you want to run and fill in your credentials.
#
# The "sdk" build contexts point at SDK repos that are not yet on public registries.
# Paths are relative to this file (composer-examples/server). Once the SDKs are published,
# drop the additional_contexts and the SDK COPY in each Dockerfile.

services:
  node-sidecar:
    build:
      context: ./node-ts
    ports:
      - "127.0.0.1:3020:3020"
    env_file:
      - path: ./node-ts/.env
        required: false

  python-sidecar:
    build:
      context: ./python
    ports:
      - "127.0.0.1:3021:3021"
    env_file:
      - path: ./python/.env
        required: false

  php-sidecar:
    build:
      context: ./php
    ports:
      - "127.0.0.1:3022:3022"
    env_file:
      - path: ./php/.env
        required: false

  ruby-sidecar:
    build:
      context: ./ruby
    ports:
      - "127.0.0.1:3023:3023"
    env_file:
      - path: ./ruby/.env
        required: false

  go-sidecar:
    build:
      context: ./go
    ports:
      - "127.0.0.1:3024:3024"
    env_file:
      - path: ./go/.env
        required: false

  java-sidecar:
    build:
      context: ./java
      additional_contexts:
        sdk: ../../composer-sdk-server-java
    ports:
      - "127.0.0.1:3025:3025"
    env_file:
      - path: ./java/.env
        required: false

  dotnet-sidecar:
    build:
      context: ./dotnet
      additional_contexts:
        sdk: ../../composer-sdk-server-dotnet
    ports:
      - "127.0.0.1:3026:3026"
    env_file:
      - path: ./dotnet/.env
        required: false
